[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skaylauncher"
description = "Desktop launcher for releases published by skayinray on GitHub"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "skayinray" }]
keywords = ["launcher", "github", "releases", "pyside6", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "PySide6-Essentials>=6.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller==6.22.3",
    "pillow>=10",
]
tools = [
    "pillow>=10",
]

[project.scripts]
skaylauncher = "skaylauncher.__main__:main"

[project.urls]
Homepage = "https://github.com/skayinray/SkayLauncher"
Repository = "https://github.com/skayinray/SkayLauncher"
Releases = "https://github.com/skayinray/SkayLauncher/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "skaylauncher.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["skaylauncher*"]

[tool.setuptools.package-data]
skaylauncher = ["updater/windows_replace.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
